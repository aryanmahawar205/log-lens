version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Backend source code
      - ./backend:/app

      # Persist DuckDB database
      - ./backend/data:/app/data

      # Expose validation datasets to the backend
      - ./validation:/app/validation
    environment:
      - NODE_ENV=development

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend