title: Common Directory Enumeration
id: j53d460b-f810-420a-97a2-cfca4c98e602
status: experimental
description: Detects attempts to access common directories that might not be publicly linked, indicating enumeration.
author: Jules
date: 2024-06-27
tags:
    - attack.discovery
    - attack.t1083
logsource:
    category: webserver
detection:
    url_dir:
        url|contains:
            - '/.git/'
            - '/.svn/'
            - '/backup/'
            - '/conf/'
            - '/logs/'
    condition: url_dir
falsepositives:
    - Normal app logic depending on structure
level: low
